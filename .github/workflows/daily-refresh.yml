name: Daily data refresh

on:
  schedule:
    - cron: "37 22 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "index.html"
      - ".github/workflows/daily-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache source data
        uses: actions/cache@v4
        with:
          path: data/.cache
          key: ai-eyes-cache-${{ github.run_id }}
          restore-keys: |
            ai-eyes-cache-

      - name: Refresh data
        run: npm run refresh

      - name: Build
        run: npm run build

      - name: Ensure .nojekyll
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Daily refresh ${{ github.run_id }}"
